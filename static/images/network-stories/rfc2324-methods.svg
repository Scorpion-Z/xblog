<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="437" viewBox="0 0 1120 437" role="img"><defs><linearGradient id="cb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#152638"/><stop offset="1" stop-color="#254b49"/></linearGradient></defs><rect width="1120" height="437" rx="20" fill="#f8f7f2"/><g font-family="Arial, 'Noto Sans SC', 'Microsoft YaHei', sans-serif"><text x="39" y="52" fill="#273c44" font-size="29" font-weight="700" text-anchor="start">HTCPCP 的四种方法：从数据到杯子</text><rect x="41" y="78" width="495" height="136" rx="14" fill="#e7f4e9" stroke="#ccdbd5" stroke-width="1.5"/><text x="66" y="118" fill="#285958" font-size="28" font-weight="700" text-anchor="start">BREW</text><text x="66" y="157" fill="#4c6165" font-size="21" font-weight="400" text-anchor="start">让咖啡壶开始或停止冲泡</text><text x="66" y="189" fill="#708184" font-size="16" font-weight="400" text-anchor="start">start / stop</text><rect x="565" y="78" width="495" height="136" rx="14" fill="#eaf2fb" stroke="#ccdbd5" stroke-width="1.5"/><text x="590" y="118" fill="#285958" font-size="28" font-weight="700" text-anchor="start">GET</text><text x="590" y="157" fill="#4c6165" font-size="21" font-weight="400" text-anchor="start">读取资源的表示</text><text x="590" y="189" fill="#708184" font-size="16" font-weight="400" text-anchor="start">咖啡被描述为物理资源</text><rect x="41" y="242" width="495" height="136" rx="14" fill="#fff1df" stroke="#ccdbd5" stroke-width="1.5"/><text x="66" y="282" fill="#285958" font-size="28" font-weight="700" text-anchor="start">PROPFIND</text><text x="66" y="321" fill="#4c6165" font-size="21" font-weight="400" text-anchor="start">获取资源的属性</text><text x="66" y="353" fill="#708184" font-size="16" font-weight="400" text-anchor="start">借用 WebDAV 的方法</text><rect x="565" y="242" width="495" height="136" rx="14" fill="#f4ecfa" stroke="#ccdbd5" stroke-width="1.5"/><text x="590" y="282" fill="#285958" font-size="28" font-weight="700" text-anchor="start">WHEN</text><text x="590" y="321" fill="#4c6165" font-size="21" font-weight="400" text-anchor="start">加奶够了，立刻停止</text><text x="590" y="353" fill="#708184" font-size="16" font-weight="400" text-anchor="start">对控制时延有要求</text></g></svg>