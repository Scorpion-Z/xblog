<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="461" viewBox="0 0 1100 461" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker><linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f213a"/><stop offset="100%" stop-color="#163f66"/></linearGradient></defs><rect width="1100" height="461" rx="21" fill="#f8fbff"/><g font-family="Arial, 'Noto Sans SC', 'Microsoft YaHei', sans-serif"><text x="33" y="51" font-size="27" fill="#16283e" font-weight="700" text-anchor="start">TCP 三次握手：遇上信鸽是什么体验？</text><text x="33" y="80" font-size="16" fill="#667a91" font-weight="500" text-anchor="start">假设 RTT 接近那次信鸽 Ping 的均值 87 分钟，只用于说明延迟的影响。</text><text x="203" y="126" font-size="22" fill="#2563eb" font-weight="650" text-anchor="middle">客户端</text><text x="908" y="126" font-size="22" fill="#15803d" font-weight="650" text-anchor="middle">服务端</text><line x1="208" y1="144" x2="208" y2="385" stroke="#9cb3c7" stroke-width="2" stroke-linecap="round" /><line x1="906" y1="144" x2="906" y2="385" stroke="#9cb3c7" stroke-width="2" stroke-linecap="round" /><line x1="222" y1="189" x2="885" y2="189" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="548" y="176" font-size="19" fill="#263951" font-weight="700" text-anchor="middle">SYN</text><line x1="885" y1="264" x2="222" y2="264" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="548" y="250" font-size="19" fill="#263951" font-weight="700" text-anchor="middle">SYN + ACK</text><line x1="222" y1="339" x2="885" y2="339" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="548" y="325" font-size="19" fill="#263951" font-weight="700" text-anchor="middle">ACK</text><text x="219" y="421" font-size="17" fill="#455b73" font-weight="500" text-anchor="start">发送方至少等待约 1 个 RTT 才能收到 SYN + ACK，应用超时也可能先到。</text></g></svg>