<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="394" viewBox="0 0 1100 394" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker><linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f213a"/><stop offset="100%" stop-color="#163f66"/></linearGradient></defs><rect width="1100" height="394" rx="21" fill="#f8fbff"/><g font-family="Arial, 'Noto Sans SC', 'Microsoft YaHei', sans-serif"><text x="35" y="56" font-size="28" fill="#15283f" font-weight="700" text-anchor="start">一封 IP 数据包，如何经过信鸽送达</text><text x="35" y="88" font-size="17" fill="#60748b" font-weight="500" text-anchor="start">原始 RFC 使用纸条和十六进制编码。下面是原理流程，并非一套可直接部署的产品。</text><rect x="22" y="146" width="188" height="97" rx="14" fill="#fff" stroke="#cfdae7" stroke-width="1.5"/><text x="42" y="176" font-size="20" fill="#172b48" font-weight="650" text-anchor="start">计算机 A</text><text x="42" y="202" font-size="15" fill="#62748b" font-weight="400" text-anchor="start">生成 IP 数据报</text><line x1="215" y1="197" x2="233" y2="197" stroke="#7387a0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="240" y="146" width="188" height="97" rx="14" fill="#fff" stroke="#cfdae7" stroke-width="1.5"/><text x="260" y="176" font-size="20" fill="#172b48" font-weight="650" text-anchor="start">转成文字</text><text x="260" y="202" font-size="15" fill="#62748b" font-weight="400" text-anchor="start">每字节写成十六进制</text><line x1="433" y1="197" x2="451" y2="197" stroke="#7387a0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="458" y="146" width="188" height="97" rx="14" fill="#e2efff" stroke="#3b82f6" stroke-width="1.5"/><text x="478" y="176" font-size="20" fill="#172b48" font-weight="650" text-anchor="start">信鸽运输</text><text x="478" y="202" font-size="15" fill="#62748b" font-weight="400" text-anchor="start">把纸卷绑在腿上</text><line x1="651" y1="197" x2="669" y2="197" stroke="#7387a0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="676" y="146" width="188" height="97" rx="14" fill="#fff" stroke="#cfdae7" stroke-width="1.5"/><text x="696" y="176" font-size="20" fill="#172b48" font-weight="650" text-anchor="start">接收端</text><text x="696" y="202" font-size="15" fill="#62748b" font-weight="400" text-anchor="start">扫描与纠错</text><line x1="869" y1="197" x2="887" y2="197" stroke="#7387a0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="894" y="146" width="188" height="97" rx="14" fill="#fff" stroke="#cfdae7" stroke-width="1.5"/><text x="914" y="176" font-size="20" fill="#172b48" font-weight="650" text-anchor="start">计算机 B</text><text x="914" y="202" font-size="15" fill="#62748b" font-weight="400" text-anchor="start">恢复原始 IP 字节</text><rect x="32" y="294" width="1035" height="71" rx="11" fill="#edf5fb" stroke="#c6d9ec" stroke-width="1.5"/><text x="51" y="329" font-size="20" fill="#213b55" font-weight="600" text-anchor="start">核心：IP 数据包格式不变，链路和物理运送方式换成了纸、胶带和会飞的快递员。</text><text x="51" y="351" font-size="15" fill="#526a82" font-weight="500" text-anchor="start">注意：归巢方向通常是单向的，要返回应答需要另行安排反向运输。</text></g></svg>