<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="434" viewBox="0 0 1100 434" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker><linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f213a"/><stop offset="100%" stop-color="#163f66"/></linearGradient></defs><rect width="1100" height="434" rx="21" fill="#f8fbff"/><g font-family="Arial, 'Noto Sans SC', 'Microsoft YaHei', sans-serif"><text x="34" y="55" font-size="28" fill="#16283e" font-weight="700" text-anchor="start">延迟与吞吐量：长途信鸽也有自己的优势场景</text><text x="34" y="86" font-size="17" fill="#61758d" font-weight="500" text-anchor="start">例子：2009 年 Winston 信鸽携带 4GB 存储卡与 ADSL 比赛。</text><rect x="36" y="131" width="487" height="148" rx="14" fill="#eef6ff" stroke="#9fc3ed" stroke-width="1.5"/><text x="56" y="161" font-size="20" fill="#172b48" font-weight="650" text-anchor="start">实时通信</text><text x="56" y="187" font-size="15" fill="#62748b" font-weight="400" text-anchor="start">关注 RTT、抖动、丢包</text><rect x="578" y="131" width="487" height="148" rx="14" fill="#fff5e9" stroke="#e9c38a" stroke-width="1.5"/><text x="598" y="161" font-size="20" fill="#172b48" font-weight="650" text-anchor="start">离线批量传输</text><text x="598" y="187" font-size="15" fill="#62748b" font-weight="400" text-anchor="start">关注一次运量、总耗时、成本</text><text x="279" y="229" font-size="22" fill="#255587" font-weight="650" text-anchor="middle">网页 / 视频会议 / 游戏</text><text x="821" y="229" font-size="22" fill="#916523" font-weight="650" text-anchor="middle">备份 / 数据迁移 / 数据归档</text><rect x="50" y="315" width="998" height="84" rx="11" fill="#fff" stroke="#cfdae6" stroke-width="1.5"/><text x="549" y="353" font-size="23" fill="#1d3852" font-weight="700" text-anchor="middle">4 GB × 8 ÷ (2 小时 6 分 57 秒) ≈ 4.20 Mb/s</text><text x="548" y="380" font-size="15" fill="#65778a" font-weight="400" text-anchor="middle">这个有效吞吐量属于存储卡运输案例，并非纸条版 RFC 1149 的实测速率。</text></g></svg>