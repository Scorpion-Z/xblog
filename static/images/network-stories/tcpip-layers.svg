<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="515" viewBox="0 0 1100 515" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker><linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f213a"/><stop offset="100%" stop-color="#163f66"/></linearGradient></defs><rect width="1100" height="515" rx="21" fill="#f8fbff"/><g font-family="Arial, 'Noto Sans SC', 'Microsoft YaHei', sans-serif"><text x="34" y="53" font-size="28" fill="#15283f" font-weight="700" text-anchor="start">TCP/IP 分层：鸽子站在哪一层？</text><text x="34" y="81" font-size="17" fill="#687b91" font-weight="500" text-anchor="start">从应用数据到物理运输，分层越往下，越接近真实介质。</text><rect x="30" y="104" width="502" height="86" rx="12" fill="#ebf4ff" stroke="#2b70b6" stroke-width="1.6"/><text x="52" y="137" font-size="23" fill="#2b70b6" font-weight="700" text-anchor="start">应用层</text><text x="190" y="135" font-size="19" fill="#253348" font-weight="650" text-anchor="start">HTTP、DNS、SSH</text><text x="190" y="162" font-size="16" fill="#667990" font-weight="500" text-anchor="start">网页、查询、远程终端</text><line x1="278" y1="190" x2="278" y2="204" stroke="#667990" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="206" width="502" height="86" rx="12" fill="#f1f5ff" stroke="#5365b3" stroke-width="1.6"/><text x="52" y="239" font-size="23" fill="#5365b3" font-weight="700" text-anchor="start">传输层</text><text x="190" y="237" font-size="19" fill="#253348" font-weight="650" text-anchor="start">TCP、UDP</text><text x="190" y="264" font-size="16" fill="#667990" font-weight="500" text-anchor="start">端口、可靠传输、拥塞控制</text><line x1="278" y1="292" x2="278" y2="306" stroke="#667990" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="308" width="502" height="86" rx="12" fill="#ecf9f3" stroke="#25805e" stroke-width="1.6"/><text x="52" y="341" font-size="23" fill="#25805e" font-weight="700" text-anchor="start">网际层</text><text x="190" y="339" font-size="19" fill="#253348" font-weight="650" text-anchor="start">IPv4 / IPv6、ICMP</text><text x="190" y="366" font-size="16" fill="#667990" font-weight="500" text-anchor="start">IP 地址、转发、差错报告</text><line x1="278" y1="394" x2="278" y2="408" stroke="#667990" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="410" width="502" height="86" rx="12" fill="#fff5e6" stroke="#aa7420" stroke-width="1.6"/><text x="52" y="443" font-size="23" fill="#aa7420" font-weight="700" text-anchor="start">网络接口层</text><text x="190" y="441" font-size="19" fill="#253348" font-weight="650" text-anchor="start">链路封装与物理运输</text><text x="190" y="468" font-size="16" fill="#667990" font-weight="500" text-anchor="start">光纤、无线、信鸽纸条</text><rect x="591" y="108" width="476" height="391" rx="14" fill="#f8fbff" stroke="#cfdae7" stroke-width="1.5"/><text x="613" y="146" font-size="24" fill="#213b55" font-weight="700" text-anchor="start">发送时逐层封装</text><rect x="634" y="179" width="339" height="49" rx="8" fill="#deebf7" stroke="#c7d7e5" stroke-width="1.5"/><text x="803.5" y="209" font-size="18" fill="#25384b" font-weight="600" text-anchor="middle">应用数据</text><rect x="647" y="243" width="313" height="49" rx="8" fill="#dfdfff" stroke="#c7d7e5" stroke-width="1.5"/><text x="803.5" y="273" font-size="18" fill="#25384b" font-weight="600" text-anchor="middle">TCP / UDP 首部 + 数据</text><rect x="660" y="308" width="286" height="49" rx="8" fill="#dcf5e5" stroke="#c7d7e5" stroke-width="1.5"/><text x="803" y="338" font-size="18" fill="#25384b" font-weight="600" text-anchor="middle">IP 首部 + 传输层报文</text><rect x="673" y="373" width="260" height="49" rx="8" fill="#ffefd2" stroke="#c7d7e5" stroke-width="1.5"/><text x="803" y="403" font-size="18" fill="#25384b" font-weight="600" text-anchor="middle">链路层封装 / 载体传送</text><text x="832" y="469" font-size="15" fill="#52667c" font-weight="400" text-anchor="middle">信鸽只替换了链路的实现，IP 仍需保持完整。</text></g></svg>