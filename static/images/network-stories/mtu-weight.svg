<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker><linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f213a"/><stop offset="100%" stop-color="#163f66"/></linearGradient></defs><rect width="1100" height="430" rx="21" fill="#f8fbff"/><g font-family="Arial, 'Noto Sans SC', 'Microsoft YaHei', sans-serif"><text x="35" y="55" font-size="29" fill="#15283f" font-weight="700" text-anchor="start">MTU：网络工程师的一次单位错乱</text><text x="35" y="86" font-size="17" fill="#64748b" font-weight="500" text-anchor="start">真实网络用字节限制载荷；RFC 1149 用纸张重量讲笑话。</text><rect x="35" y="130" width="320" height="117" rx="14" fill="#e8f3ff" stroke="#80b5e6" stroke-width="1.5"/><text x="55" y="160" font-size="20" fill="#172b48" font-weight="650" text-anchor="start">以太网常见 MTU</text><text x="55" y="186" font-size="15" fill="#62748b" font-weight="400" text-anchor="start">1500 字节</text><rect x="389" y="130" width="320" height="117" rx="14" fill="#e9f7ef" stroke="#8bc8a5" stroke-width="1.5"/><text x="409" y="160" font-size="20" fill="#172b48" font-weight="650" text-anchor="start">IPv6 最小链路 MTU</text><text x="409" y="186" font-size="15" fill="#62748b" font-weight="400" text-anchor="start">1280 字节</text><rect x="743" y="130" width="320" height="117" rx="14" fill="#fff3e0" stroke="#edb761" stroke-width="1.5"/><text x="763" y="160" font-size="20" fill="#172b48" font-weight="650" text-anchor="start">RFC 1149 示例 MTU</text><text x="763" y="186" font-size="15" fill="#62748b" font-weight="400" text-anchor="start">256 毫克</text><text x="195" y="307" font-size="23" fill="#2563eb" font-weight="650" text-anchor="middle">数据长度</text><text x="549" y="307" font-size="23" fill="#16a34a" font-weight="650" text-anchor="middle">数据长度</text><text x="903" y="307" font-size="23" fill="#be812a" font-weight="650" text-anchor="middle">纸的质量</text><rect x="60" y="341" width="980" height="53" rx="8" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><text x="550" y="374" font-size="18" fill="#445b73" font-weight="500" text-anchor="middle">256 mg 无法直接设置成系统 MTU。必须先换算实际可承载的字节数。</text></g></svg>