<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="448" viewBox="0 0 1100 448" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker><linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f213a"/><stop offset="100%" stop-color="#163f66"/></linearGradient></defs><rect width="1100" height="448" rx="21" fill="#f8fbff"/><g font-family="Arial, 'Noto Sans SC', 'Microsoft YaHei', sans-serif"><text x="34" y="55" font-size="29" fill="#172b48" font-weight="700" text-anchor="start">IPv4 数据报：它到底运了什么？</text><text x="34" y="84" font-size="17" fill="#66788b" font-weight="500" text-anchor="start">下面是 IPv4 最小首部的概念图（每行 32 位），对应 RFC 791。</text><rect x="50" y="113" width="82" height="44" rx="4" fill="#eaf3fc" stroke="#c0d2e4" stroke-width="1"/><text x="91" y="140" font-size="14" fill="#244461" font-weight="600" text-anchor="middle">版本 4</text><rect x="132" y="113" width="82" height="44" rx="4" fill="#eaf3fc" stroke="#c0d2e4" stroke-width="1"/><text x="173" y="140" font-size="14" fill="#244461" font-weight="600" text-anchor="middle">IHL=5</text><rect x="214" y="113" width="130" height="44" rx="4" fill="#eaf3fc" stroke="#c0d2e4" stroke-width="1"/><text x="279" y="140" font-size="17" fill="#244461" font-weight="600" text-anchor="middle">DSCP/ECN</text><rect x="344" y="113" width="700" height="44" rx="4" fill="#eaf3fc" stroke="#c0d2e4" stroke-width="1"/><text x="694" y="140" font-size="17" fill="#244461" font-weight="600" text-anchor="middle">总长度</text><rect x="50" y="167" width="480" height="44" rx="4" fill="#f7f9fc" stroke="#c0d2e4" stroke-width="1"/><text x="290" y="194" font-size="17" fill="#244461" font-weight="600" text-anchor="middle">标识 Identification</text><rect x="530" y="167" width="200" height="44" rx="4" fill="#f7f9fc" stroke="#c0d2e4" stroke-width="1"/><text x="630" y="194" font-size="17" fill="#244461" font-weight="600" text-anchor="middle">Flags</text><rect x="730" y="167" width="314" height="44" rx="4" fill="#f7f9fc" stroke="#c0d2e4" stroke-width="1"/><text x="887" y="194" font-size="17" fill="#244461" font-weight="600" text-anchor="middle">片偏移</text><rect x="50" y="221" width="238" height="44" rx="4" fill="#eaf3fc" stroke="#c0d2e4" stroke-width="1"/><text x="169" y="248" font-size="17" fill="#244461" font-weight="600" text-anchor="middle">TTL</text><rect x="288" y="221" width="238" height="44" rx="4" fill="#eaf3fc" stroke="#c0d2e4" stroke-width="1"/><text x="407" y="248" font-size="17" fill="#244461" font-weight="600" text-anchor="middle">Protocol</text><rect x="526" y="221" width="518" height="44" rx="4" fill="#eaf3fc" stroke="#c0d2e4" stroke-width="1"/><text x="785" y="248" font-size="17" fill="#244461" font-weight="600" text-anchor="middle">首部校验和</text><rect x="50" y="275" width="994" height="44" rx="4" fill="#f7f9fc" stroke="#c0d2e4" stroke-width="1"/><text x="547" y="302" font-size="17" fill="#244461" font-weight="600" text-anchor="middle">源 IPv4 地址</text><rect x="50" y="329" width="994" height="44" rx="4" fill="#eaf3fc" stroke="#c0d2e4" stroke-width="1"/><text x="547" y="356" font-size="17" fill="#244461" font-weight="600" text-anchor="middle">目的 IPv4 地址</text><text x="52" y="411" font-size="17" fill="#556c80" font-weight="500" text-anchor="start">例如 45 00 00 54 ... 表示 IPv4、20 字节首部、总长度 84 字节（此处只展示片段）。</text></g></svg>