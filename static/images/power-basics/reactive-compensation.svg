<text x="300" y="292" fill="#15916d" font-size="23" font-weight="700" text-anchor="middle">有功 P</text><text x="300" y="409" fill="#2c75d7" font-size="23" font-weight="700" text-anchor="middle">无功 Q</text>
<rect x="95" y="474" width="440" height="77" rx="22" fill="#fff1ee" stroke="#f6d6d1" stroke-width="2"/><text x="315" y="522" fill="#c34a43" font-size="27" font-weight="750" text-anchor="middle">线路电流较大</text>
<rect x="617" y="140" width="532" height="444" rx="22" fill="#fff" stroke="#dce6ef" stroke-width="2"/><rect x="639" y="158" width="145" height="44" rx="22" fill="#15916d" stroke="#15916d" stroke-width="2"/><text x="711.5" y="188" fill="#fff" font-size="23" font-weight="700" text-anchor="middle">补偿后</text><text x="813" y="190" fill="#1b3556" font-size="21" font-weight="650" text-anchor="start">上游提供有功和较少无功</text>
<g transform="translate(664 324)" stroke="#6e8398" stroke-width="5" stroke-linecap="round" fill="none"><path d="M0 84 L40 -48 L80 84 M40 -48 V84 M-12 -9 H92 M0 23 H80 M12 53 H68 M0 84 H80"/></g><g transform="translate(1031 360)"><rect x="-48" y="-29" width="96" height="66" rx="17" fill="#d8eafc" stroke="#2c75d7" stroke-width="5"/><path d="M-24 -28 V37 M-6 -28 V37 M12 -28 V37 M30 -28 V37" stroke="#82b3e5" stroke-width="4"/><path d="M48 2 H76" stroke="#708fae" stroke-width="9"/><rect x="-57" y="38" width="120" height="11" rx="4" fill="#91a9bf"/></g>
