<text x="1045" y="551" fill="#2c75d7" font-size="19" font-weight="650" text-anchor="middle">本地提供无功支持</text>
<rect x="28" y="616" width="1144" height="61" rx="17" fill="#eaf1f8" stroke="#eaf1f8" stroke-width="2"/><text x="60" y="656" fill="#1b3556" font-size="23" font-weight="650" text-anchor="start">本地补偿后，有功需求基本不变，上游需要输送的无功和电流通常减少。</text></svg>