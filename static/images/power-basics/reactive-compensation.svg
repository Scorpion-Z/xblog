<rect x="911" y="454" width="110" height="76" rx="13" fill="#deecfc" stroke="#2c75d7" stroke-width="4"/><text x="966" y="485" fill="#2c75d7" font-size="22" font-weight="750" text-anchor="middle">补偿</text><text x="966" y="514" fill="#2c75d7" font-size="20" font-weight="750" text-anchor="middle">电容柜</text>
