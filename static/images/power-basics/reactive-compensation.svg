<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="ttl ds"><title id="ttl">图4  无功补偿为什么能减轻电网负担？</title><desc id="ds">并排比较补偿前和补偿后，感性负载附近的电容柜提供容性无功，减少上游线路电流。</desc><defs><marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#15916d"/></marker><marker id="arrowB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#2c75d7"/></marker><marker id="arrowO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#e89b32"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}</style><rect width="1200" height="700" rx="30" fill="#f5f9fd"/><rect x="28" y="24" width="1144" height="89" rx="25" fill="#e6f2ff" stroke="#e6f2ff" stroke-width="2"/><text x="60" y="81" fill="#1b3556" font-size="39" font-weight="800" text-anchor="start">图4  无功补偿为什么能减轻电网负担？</text>
<rect x="50" y="140" width="532" height="444" rx="22" fill="#fff" stroke="#dce6ef" stroke-width="2"/><rect x="72" y="158" width="145" height="44" rx="22" fill="#dc665c" stroke="#dc665c" stroke-width="2"/><text x="144.5" y="188" fill="#fff" font-size="23" font-weight="700" text-anchor="middle">补偿前</text><text x="250" y="190" fill="#1b3556" font-size="22" font-weight="650" text-anchor="start">上游提供有功和较多无功</text>
<g transform="translate(100 324)" stroke="#6e8398" stroke-width="5" stroke-linecap="round" fill="none"><path d="M0 84 L40 -48 L80 84 M40 -48 V84 M-12 -9 H92 M0 23 H80 M12 53 H68 M0 84 H80"/></g><g transform="translate(465 360)"><rect x="-48" y="-29" width="96" height="66" rx="17" fill="#d8eafc" stroke="#2c75d7" stroke-width="5"/><path d="M-24 -28 V37 M-6 -28 V37 M12 -28 V37 M30 -28 V37" stroke="#82b3e5" stroke-width="4"/><path d="M48 2 H76" stroke="#708fae" stroke-width="9"/><rect x="-57" y="38" width="120" height="11" rx="4" fill="#91a9bf"/></g>
