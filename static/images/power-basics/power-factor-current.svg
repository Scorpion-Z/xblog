<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="ttl ds"><title id="ttl">图2  功率因数越低，为什么电流越大？</title><desc id="ds">1000瓦、220伏单相正弦交流下，功率因数1、0.8、0.5分别对应4.55、5.68、9.09安培。</desc><defs><marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#15916d"/></marker><marker id="arrowB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#2c75d7"/></marker><marker id="arrowO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#e89b32"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}</style><rect width="1200" height="700" rx="30" fill="#f5f9fd"/><rect x="28" y="24" width="1144" height="89" rx="25" fill="#e6f2ff" stroke="#e6f2ff" stroke-width="2"/><text x="60" y="81" fill="#1b3556" font-size="39" font-weight="800" text-anchor="start">图2  功率因数越低，为什么电流越大？</text><rect x="70" y="140" width="1060" height="91" rx="22" fill="#fff" stroke="#dce6ef" stroke-width="2"/><text x="96" y="180" fill="#1b3556" font-size="27" font-weight="650" text-anchor="start">共同条件：单相 220 V，实际有功功率 1000 W</text><text x="96" y="210" fill="#54677e" font-size="22" font-weight="500" text-anchor="start">电流 I = 1000 ÷（220 × 功率因数）</text><rect x="142" y="254" width="248" height="340" rx="22" fill="#fff" stroke="#dce6ef" stroke-width="2"/><text x="266" y="299" fill="#1b3556" font-size="25" font-weight="700" text-anchor="middle">功率因数 1.0</text><rect x="226" y="401" width="80" height="149" rx="12" fill="#15916d" opacity=".87"/><line x1="164" y1="551" x2="368" y2="551" stroke="#95aabe" stroke-width="2"/><text x="266" y="584" fill="#15916d" font-size="29" font-weight="800" text-anchor="middle">4.55 A</text><rect x="475" y="254" width="248" height="340" rx="22" fill="#fff" stroke="#dce6ef" stroke-width="2"/><text x="599" y="299" fill="#1b3556" font-size="25" font-weight="700" text-anchor="middle">功率因数 0.8</text><rect x="559" y="363" width="80" height="187" rx="12" fill="#2c75d7" opacity=".87"/><line x1="497" y1="551" x2="701" y2="551" stroke="#95aabe" stroke-width="2"/><text x="599" y="584" fill="#2c75d7" font-size="29" font-weight="800" text-anchor="middle">5.68 A</text><rect x="808" y="254" width="248" height="340" rx="22" fill="#fff" stroke="#dce6ef" stroke-width="2"/><text x="932" y="299" fill="#1b3556" font-size="25" font-weight="700" text-anchor="middle">功率因数 0.5</text><rect x="892" y="265" width="80" height="285" rx="12" fill="#e89b32" opacity=".87"/><line x1="830" y1="551" x2="1034" y2="551" stroke="#95aabe" stroke-width="2"/><text x="932" y="584" fill="#e89b32" font-size="29" font-weight="800" text-anchor="middle">9.09 A</text><rect x="28" y="616" width="1144" height="61" rx="17" fill="#eaf1f8" stroke="#eaf1f8" stroke-width="2"/><text x="60" y="656" fill="#1b3556" font-size="23" font-weight="650" text-anchor="start">同样的有功功率和电压下，功率因数从 1 降到 0.5，线路电流会翻倍。</text></svg>