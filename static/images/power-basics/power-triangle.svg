<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="ttl ds"><title id="ttl">图5  一张图看懂 P、Q、S 的关系</title><desc id="ds">有功功率P、无功功率Q、视在功率S构成功率三角形，满足S平方等于P平方加Q平方。</desc><defs><marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#15916d"/></marker><marker id="arrowB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#2c75d7"/></marker><marker id="arrowO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#e89b32"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}</style><rect width="1200" height="700" rx="30" fill="#f5f9fd"/><rect x="28" y="24" width="1144" height="89" rx="25" fill="#e6f2ff" stroke="#e6f2ff" stroke-width="2"/><text x="60" y="81" fill="#1b3556" font-size="39" font-weight="800" text-anchor="start">图5  一张图看懂 P、Q、S 的关系</text>
<rect x="60" y="142" width="725" height="445" rx="22" fill="#fff" stroke="#dce6ef" stroke-width="2"/>
<path d="M172 518 H699" stroke="#15916d" stroke-width="8" fill="none" marker-end="url(#arrowG)"/>
<path d="M699 518 V225" stroke="#2c75d7" stroke-width="8" fill="none" marker-end="url(#arrowB)"/>
<path d="M172 518 L699 225" stroke="#e89b32" stroke-width="9" fill="none" marker-end="url(#arrowO)"/>
<path d="M670 518 V490 H699" fill="none" stroke="#9fadc0" stroke-width="3"/>
<path d="M222 518 A50 50 0 0 0 215 493" stroke="#b6a46e" stroke-width="3" fill="none"/>
<text x="240" y="494" fill="#1b3556" font-size="26" font-weight="700" text-anchor="start">φ</text>
<text x="399" y="561" fill="#15916d" font-size="25" font-weight="750" text-anchor="middle">有功功率 P（kW）</text>
<text x="705" y="350" fill="#2c75d7" font-size="23" font-weight="750" text-anchor="start">无功 Q</text>
<text x="345" y="307" fill="#e89b32" font-size="24" font-weight="750" text-anchor="start">视在功率 S（kVA）</text>
<rect x="818" y="150" width="330" height="116" rx="22" fill="#e9f8ef" stroke="#d4ebdf" stroke-width="2"/><text x="845" y="193" fill="#15916d" font-size="28" font-weight="800" text-anchor="start">P  有功功率</text><text x="845" y="232" fill="#54677e" font-size="21" font-weight="500" text-anchor="start">实际消耗的功率</text>
<rect x="818" y="281" width="330" height="116" rx="22" fill="#eaf3ff" stroke="#d8e6f8" stroke-width="2"/><text x="845" y="324" fill="#2c75d7" font-size="28" font-weight="800" text-anchor="start">Q  无功功率</text><text x="845" y="363" fill="#54677e" font-size="21" font-weight="500" text-anchor="start">电磁场能量交换</text>
<rect x="818" y="414" width="330" height="116" rx="22" fill="#fff3e1" stroke="#fae3c2" stroke-width="2"/><text x="845" y="456" fill="#e89b32" font-size="28" font-weight="800" text-anchor="start">S  视在功率</text><text x="845" y="493" fill="#54677e" font-size="21" font-weight="500" text-anchor="start">电压与电流的乘积</text>
<rect x="75" y="558" width="1073" height="49" rx="13" fill="#fff" stroke="#dce5ee" stroke-width="2"/><text x="350" y="591" fill="#1b3556" font-size="28" font-weight="750" text-anchor="middle">S² = P² + Q²</text><text x="871" y="591" fill="#1b3556" font-size="25" font-weight="750" text-anchor="middle">功率因数 = P / S</text>
<rect x="28" y="616" width="1144" height="61" rx="17" fill="#eaf1f8" stroke="#eaf1f8" stroke-width="2"/><text x="60" y="656" fill="#1b3556" font-size="23" font-weight="650" text-anchor="start">正弦交流电的功率三角形：P 是水平边，Q 是竖直边，S 是斜边。</text></svg>