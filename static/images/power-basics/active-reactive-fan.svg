<text x="564" y="214" fill="#15916d" font-size="28" font-weight="800" text-anchor="middle">有功功率 P</text><text x="570" y="284" fill="#54677e" font-size="20" font-weight="500" text-anchor="middle">实际消耗电能，带动风扇运转</text>
<path d="M356 377 H784" stroke="#2c75d7" stroke-width="9" fill="none" stroke-linecap="round" marker-end="url(#arrowB)"/><path d="M784 405 H356" stroke="#2c75d7" stroke-width="9" fill="none" stroke-linecap="round" marker-end="url(#arrowB)"/>
<text x="572" y="347" fill="#2c75d7" font-size="28" font-weight="800" text-anchor="middle">无功功率 Q</text><text x="572" y="448" fill="#54677e" font-size="19" font-weight="500" text-anchor="middle">与交变磁场相关的能量往复交换</text>
<rect x="65" y="498" width="525" height="96" rx="22" fill="#e5f7ed" stroke="#d0e6d6" stroke-width="2"/><text x="97" y="540" fill="#15916d" font-size="23" font-weight="700" text-anchor="start">P：转动、发热等实际能量转换</text><text x="97" y="572" fill="#54677e" font-size="19" font-weight="500" text-anchor="start">功率单位：瓦 W、千瓦 kW</text>
