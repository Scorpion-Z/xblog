<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="ttl ds"><title id="ttl">图1  有功功率和无功功率</title><desc id="ds">以电风扇说明有功功率用于驱动和发热，无功功率与电磁场储能往复交换。</desc><defs><marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#15916d"/></marker><marker id="arrowB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#2c75d7"/></marker><marker id="arrowO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#e89b32"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}</style><rect width="1200" height="700" rx="30" fill="#f5f9fd"/><rect x="28" y="24" width="1144" height="89" rx="25" fill="#e6f2ff" stroke="#e6f2ff" stroke-width="2"/><text x="60" y="81" fill="#1b3556" font-size="39" font-weight="800" text-anchor="start">图1  有功功率和无功功率</text>
