<rect x="28" y="616" width="1144" height="61" rx="17" fill="#eaf1f8" stroke="#eaf1f8" stroke-width="2"/><text x="60" y="656" fill="#1b3556" font-size="23" font-weight="650" text-anchor="start">记忆要点：有功对应实际能量消耗，无功对应交变电磁场中的能量交换。</text></svg>