{{- /* Third-party counters should not run in Hugo's local development mode. */ -}}
{{- if hugo.IsProduction }}
<div class="x-traffic-bar" aria-label="站点访问统计">
  <span>总访问 <strong id="vercount_value_site_pv">—</strong> 次</span>
  <span class="x-traffic-divider" aria-hidden="true">·</span>
  <span>独立访客 <strong id="vercount_value_site_uv">—</strong> 人</span>
</div>
<script src="https://events.vercount.one/js" defer></script>
{{- end }}

<nav class="journal-footer-links" aria-label="页脚导航">
  <a href="{{ "about/" | relURL }}">关于</a>
  <a href="{{ "index.xml" | relURL }}">RSS</a>
</nav>

{{- if not site.Params.disableThemeToggle }}
<script>
(() => {
  const button = document.getElementById("theme-toggle");
  if (!button) return;
  const root = document.documentElement;
  const updateLabel = () => {
    const label = root.dataset.theme === "dark" ? "切换为浅色主题" : "切换为深色主题";
    button.setAttribute("aria-label", label);
    button.title = label + "（Alt + T）";
  };
  updateLabel();
  new MutationObserver(updateLabel).observe(root, {attributeFilter: ["data-theme"]});
})();
</script>
{{- end }}
