{{- define "main" -}}
<section class="journal-archive" aria-labelledby="archives-heading">
  <header class="journal-archive-heading">
    <h1 id="archives-heading">归档</h1>
    <p>按发表时间整理。</p>
  </header>
  {{- range (where site.RegularPages "Section" "posts").GroupByDate "2006" }}
  <section class="journal-archive-year" aria-labelledby="year-{{ .Key }}">
    <h2 id="year-{{ .Key }}">{{ .Key }}</h2>
    <ol class="journal-archive-list">
      {{- range .Pages.ByDate.Reverse }}
      <li>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01-02" }}</time>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
      {{- end }}
    </ol>
  </section>
  {{- end }}
</section>
{{- end -}}
